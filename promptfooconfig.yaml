# Generated by scripts/gen_promptfoo_config.py from fixtures/tickets.json. Do not hand-edit.
description: Support-ticket classifier prompt regression suite
prompts:
  - file://prompts/classify.txt
providers:
  - id: file://providers/replay_provider.py
    label: replay (recorded responses, no live API calls)
tests:
  - vars:
      id: "t01"
      ticket_text: "I was charged twice for my subscription this month. Please refund the duplicate charge."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "billing"'
      - type: python
        value: 'json.loads(output)["priority"] == "high"'
  - vars:
      id: "t02"
      ticket_text: "My invoice PDF from last month shows the wrong company address, can you correct it for our records?"
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "billing"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t03"
      ticket_text: "The app crashes every time I try to upload a file larger than 10MB."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "technical"'
      - type: python
        value: 'json.loads(output)["priority"] == "high"'
  - vars:
      id: "t04"
      ticket_text: "Dark mode toggle in settings doesn't persist after I refresh the page."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "technical"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t05"
      ticket_text: "Production API is returning 500 errors for all requests since 10 minutes ago, our whole team is blocked."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "technical"'
      - type: python
        value: 'json.loads(output)["priority"] == "urgent"'
  - vars:
      id: "t06"
      ticket_text: "I can't log in, it says my password is wrong but I just reset it five minutes ago."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "account"'
      - type: python
        value: 'json.loads(output)["priority"] == "high"'
  - vars:
      id: "t07"
      ticket_text: "Please change the email address on my account from old@example.com to new@example.com."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "account"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t08"
      ticket_text: "How do I delete my account and all associated data permanently?"
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "account"'
      - type: python
        value: 'json.loads(output)["priority"] == "medium"'
  - vars:
      id: "t09"
      ticket_text: "It would be great if the dashboard supported exporting reports as CSV, not just PDF."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "feature_request"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t10"
      ticket_text: "Can you add a dark mode option? A lot of us work at night."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "feature_request"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t11"
      ticket_text: "We need SSO/SAML support before our security team will approve renewing our contract."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "feature_request"'
      - type: python
        value: 'json.loads(output)["priority"] == "high"'
  - vars:
      id: "t12"
      ticket_text: "Just wanted to say the new onboarding flow is really smooth, nice work."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "other"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t13"
      ticket_text: "Do you offer a nonprofit discount? We're a small education charity."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "other"'
      - type: python
        value: 'json.loads(output)["priority"] == "low"'
  - vars:
      id: "t14"
      ticket_text: "Someone logged into my account from a country I've never visited, please investigate immediately."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "account"'
      - type: python
        value: 'json.loads(output)["priority"] == "urgent"'
  - vars:
      id: "t15"
      ticket_text: "My card on file expired, the payment failed and now my account is suspended, I need this fixed today."
    assert:
      - type: is-json
      - type: python
        value: 'json.loads(output)["category"] == "billing"'
      - type: python
        value: 'json.loads(output)["priority"] == "urgent"'
